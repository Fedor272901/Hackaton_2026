services:
  db:
    image: postgis/postgis:16-3.4
    container_name: hackaton_2026_db
    environment:
      POSTGRES_DB: hackaton
      POSTGRES_USER: hackaton
      POSTGRES_PASSWORD: hackaton
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hackaton -d hackaton"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: hackaton_2026_backend
    environment:
      DATABASE_URL: postgresql://hackaton:hackaton@db:5432/hackaton
      SECRET_KEY: change-me
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             python seed.py &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  nginx:
    image: nginx:alpine
    container_name: hackaton_2026_nginx
    depends_on:
      - backend
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./templates:/usr/share/nginx/html/templates:ro
      - ./static:/usr/share/nginx/html/static:ro

volumes:
  postgres_data:
